<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Santa</title>
  <meta name="description" content="The family Christmas wish list that keeps a secret. Call dibs on gifts so nobody doubles up, and never see what's coming for you.">
  <meta name="theme-color" content="#c63a2e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@700&family=Gochi+Hand&family=Shrikhand&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="boot">
      <span class="boot-ball"></span>
      <p>Warming up the workshop…</p>
    </div>
  </div>
  <div id="toasts" aria-live="assertive"></div>
  <dialog id="dialog"></dialog>
  <noscript><p class="noscript">Family Santa needs JavaScript turned on. Even elves use it.</p></noscript>
</body>
</html>
